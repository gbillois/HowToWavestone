<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SAM secure-by-design animated preview</title>
  <desc id="desc">An architecture document arrives in SAM and is evaluated against a security checklist containing compliant green controls and non-compliant red controls.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif}
    .panel{fill:#fff;stroke:#e3e0ed;stroke-width:2}
    .muted{fill:#6b6580;font-size:14px;font-weight:650}
    .small{fill:#fff;font-size:16px;font-weight:800}
    .label{fill:#16121f;font-size:17px;font-weight:800}
    .tiny{fill:#6b6580;font-size:12px;font-weight:700}
    .line{stroke:#cfccdc;stroke-width:7;stroke-linecap:square}
    #architecture{animation:arrive 7s cubic-bezier(.2,0,0,1) infinite}
    #scan{animation:scan 7s ease-in-out infinite}
    #results g{animation:reveal 7s ease-in-out infinite}
    #results g:nth-child(2){animation-delay:.15s}
    #results g:nth-child(3){animation-delay:.3s}
    #results g:nth-child(4){animation-delay:.45s}
    @keyframes arrive{0%,8%{opacity:0;transform:translateX(-90px)}24%,88%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(15px)}}
    @keyframes scan{0%,22%{opacity:0;transform:translateX(-80px)}38%,76%{opacity:1;transform:translateX(130px)}88%,100%{opacity:0;transform:translateX(130px)}}
    @keyframes reveal{0%,38%{opacity:.18;transform:translateY(10px)}52%,92%{opacity:1;transform:translateY(0)}100%{opacity:.18}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8f5f4"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
    <linearGradient id="nav" x1="54" y1="42" x2="906" y2="42"><stop stop-color="#451dc7"/><stop offset=".62" stop-color="#5a2be0"/><stop offset="1" stop-color="#228d95"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0e4153" flood-opacity=".14"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="54" y="42" width="852" height="456" fill="#fff" stroke="#d7d4e3" stroke-width="2"/>
  <rect x="54" y="42" width="852" height="64" fill="url(#nav)"/>
  <circle cx="78" cy="74" r="5" fill="#fff" opacity=".55"/><circle cx="96" cy="74" r="5" fill="#fff" opacity=".55"/><circle cx="114" cy="74" r="5" fill="#fff" opacity=".55"/>
  <text x="145" y="72" class="small">SAM · Security Agent Manager</text>
  <text x="145" y="90" fill="#dffbea" font-size="10" font-weight="800">SECURE BY DESIGN REVIEW</text>

  <rect class="panel" x="84" y="132" width="332" height="322" filter="url(#shadow)"/>
  <text x="112" y="170" class="label">Architecture input</text>
  <text x="112" y="194" class="muted">New design document received</text>
  <g id="architecture">
    <rect x="136" y="220" width="226" height="180" fill="#f7f5ff" stroke="#bdaff0" stroke-width="2"/>
    <path d="M304 220v48h58" fill="#e7e1ff" stroke="#bdaff0" stroke-width="2"/>
    <path d="M304 220l58 48" fill="none" stroke="#bdaff0" stroke-width="2"/>
    <text x="160" y="260" fill="#451dc7" font-size="13" font-weight="800">ARCHITECTURE_v3.pdf</text>
    <path class="line" d="M160 286h138M160 310h166M160 334h112"/>
    <g fill="none" stroke="#228d95" stroke-width="3">
      <rect x="160" y="354" width="44" height="28"/><rect x="260" y="354" width="44" height="28"/><path d="M204 368h56"/>
    </g>
  </g>
  <g id="scan">
    <rect x="122" y="212" width="5" height="198" fill="#04f06a"/>
    <rect x="127" y="212" width="22" height="198" fill="#04f06a" opacity=".13"/>
  </g>

  <path d="M444 292h54" fill="none" stroke="#451dc7" stroke-width="4"/>
  <path d="m486 280 14 12-14 12" fill="none" stroke="#451dc7" stroke-width="4"/>

  <rect class="panel" x="526" y="132" width="350" height="322" filter="url(#shadow)"/>
  <text x="554" y="170" class="label">Security checklist</text>
  <text x="554" y="194" class="muted">Controls mapped to the design</text>
  <g id="results">
    <g transform="translate(554 224)">
      <rect width="294" height="44" fill="#e1fded" stroke="#9ce8bc"/>
      <circle cx="22" cy="22" r="11" fill="#088a42"/><path d="m16 22 4 4 8-9" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="44" y="19" class="tiny">Identity &amp; access model</text><text x="44" y="34" fill="#088a42" font-size="10" font-weight="800">COMPLIANT</text>
    </g>
    <g transform="translate(554 280)">
      <rect width="294" height="44" fill="#fff0ed" stroke="#f0b2a7"/>
      <circle cx="22" cy="22" r="11" fill="#d8412f"/><path d="m17 17 10 10m0-10-10 10" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="44" y="19" class="tiny">Encryption boundary</text><text x="44" y="34" fill="#d8412f" font-size="10" font-weight="800">GAP TO ADDRESS</text>
    </g>
    <g transform="translate(554 336)">
      <rect width="294" height="44" fill="#e1fded" stroke="#9ce8bc"/>
      <circle cx="22" cy="22" r="11" fill="#088a42"/><path d="m16 22 4 4 8-9" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="44" y="19" class="tiny">Network segmentation</text><text x="44" y="34" fill="#088a42" font-size="10" font-weight="800">COMPLIANT</text>
    </g>
    <g transform="translate(554 392)">
      <rect width="294" height="44" fill="#fff0ed" stroke="#f0b2a7"/>
      <circle cx="22" cy="22" r="11" fill="#d8412f"/><path d="m17 17 10 10m0-10-10 10" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="44" y="19" class="tiny">Logging &amp; monitoring</text><text x="44" y="34" fill="#d8412f" font-size="10" font-weight="800">GAP TO ADDRESS</text>
    </g>
  </g>
</svg>
